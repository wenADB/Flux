name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the APK attached'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Android SDK & Install Platform Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Wrapper and Scripts
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Prepare Environment Configuration
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "✓ Created .env from .env.example"
            else
              echo "STORE_PASSWORD=android" > .env
              echo "KEY_PASSWORD=android" >> .env
              echo "✓ Created .env with default values"
            fi
          fi

      - name: Generate Signing Keystores
        run: |
          # Create debug.keystore if missing (valid RSA keystore without invalid flags)
          if [ ! -f debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore debug.keystore -storepass android -keypass android \
              -dname "CN=Android Debug,O=FLUX,C=US"
            echo "✓ Debug keystore created"
          fi

          # Create upload key for release build if missing
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating release keystore..."
            keytool -genkeypair -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore my-upload-key.jks -storepass android -keypass android \
              -dname "CN=Android Release,O=FLUX,C=US"
            echo "✓ Release keystore created"
          fi

      - name: Build Debug APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle :app:assembleDebug --stacktrace || ./gradlew :app:assembleDebug --stacktrace
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✓ Debug APK built successfully"
          else
            echo "❌ Debug APK not found"
            exit 1
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle :app:assembleRelease --stacktrace || ./gradlew :app:assembleRelease --stacktrace || {
            echo "⚠ Release APK build warning (will continue with debug APK)"
          }

      - name: Prepare APK outputs
        run: |
          mkdir -p release-apks
          
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/FLUX-release.apk
            echo "✓ Release APK ready: release-apks/FLUX-release.apk"
          fi
          
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/FLUX-debug.apk
            echo "✓ Debug APK ready: release-apks/FLUX-debug.apk"
          fi
          
          echo ""
          echo "Output APK files:"
          ls -lh release-apks/

      - name: Upload APKs to Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-APK-Download
          path: release-apks/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: FLUX Android App (${{ github.event.inputs.release_tag || github.ref_name }})
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## FLUX: Android Performance & Optimization Engine
            Download the attached APK to install directly on your Android device:
            - **FLUX-release.apk**: Production release build.
            - **FLUX-debug.apk**: Debug build signed with standard debug credentials.
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
