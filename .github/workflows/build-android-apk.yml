name: Build & Release Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "9.3.1"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build FLUX Android APK
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # JAVA
      # ------------------------------------------------------------

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # ANDROID SDK
      # ------------------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ------------------------------------------------------------
      # VERIFY PROJECT
      # ------------------------------------------------------------

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "FLUX PROJECT"
          echo "=============================================="

          pwd

          echo
          echo "Root files:"
          ls -la

          echo
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

          echo
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

          echo "Required project files exist."

      # ------------------------------------------------------------
      # GRADLE WRAPPER
      # ------------------------------------------------------------
      #
      # The repository currently does not contain
      # gradle-wrapper.jar.
      #
      # GitHub Actions already has a system Gradle available.
      # Generate the official wrapper from Gradle itself.
      #
      # ------------------------------------------------------------

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "GENERATING GRADLE WRAPPER"
          echo "=============================================="

          gradle --version

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew

          chmod +x gradlew

          echo
          echo "Wrapper generated successfully."

          ls -lh gradle/wrapper/

      # ------------------------------------------------------------
      # VERIFY WRAPPER
      # ------------------------------------------------------------

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

      # ------------------------------------------------------------
      # GRADLE TASKS
      # ------------------------------------------------------------

      - name: List Android tasks
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --no-configuration-cache

      # ------------------------------------------------------------
      # CLEAN
      # ------------------------------------------------------------

      - name: Clean Android project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      # ------------------------------------------------------------
      # DEBUG APK
      # ------------------------------------------------------------

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --max-workers=2

      # ------------------------------------------------------------
      # RELEASE APK
      # ------------------------------------------------------------

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --max-workers=2

      # ------------------------------------------------------------
      # VERIFY APK
      # ------------------------------------------------------------

      - name: Verify generated APKs
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "GENERATED APK FILES"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"

      # ------------------------------------------------------------
      # UPLOAD DEBUG APK
      # ------------------------------------------------------------

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: FLUX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ------------------------------------------------------------
      # UPLOAD RELEASE APK
      # ------------------------------------------------------------

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: FLUX-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
