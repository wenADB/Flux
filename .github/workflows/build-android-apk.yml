name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: false
        type: boolean

      release_tag:
        description: "Release tag"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: flux-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FLUX Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. VERIFY JAVA
      # ==========================================================

      - name: Verify Java
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "JAVA ENVIRONMENT"
          echo "=============================================="

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "Java:"
          java -version

          echo
          echo "Java executable:"
          command -v java

          echo
          echo "Resolved Java:"
          readlink -f "$(command -v java)" || true


      # ==========================================================
      # 4. VERIFY ANDROID SDK
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK was not found at:"
            echo "$SDK"
            exit 1
          fi

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "SDK:"
          echo "$SDK"

          echo
          echo "Android platforms:"
          find "$SDK/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            2>/dev/null || true

          echo
          echo "Build Tools:"
          find "$SDK/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            2>/dev/null || true

          echo
          echo "ADB:"
          adb version || true


      # ==========================================================
      # 5. CONFIGURE ANDROID SDK
      # ==========================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -d "$SDK/platform-tools" ]; then
            echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          fi

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi


      # ==========================================================
      # 6. DISCOVER ANDROID PROJECT
      # ==========================================================

      - name: Discover Android project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "DISCOVERING ANDROID PROJECT"
          echo "=============================================="

          echo
          echo "Repository root:"
          pwd

          echo
          echo "Top-level files:"
          ls -la

          echo
          echo "Searching for settings.gradle..."

          SETTINGS_FILE=""

          if [ -f "./settings.gradle.kts" ]; then
            SETTINGS_FILE="./settings.gradle.kts"
          elif [ -f "./settings.gradle" ]; then
            SETTINGS_FILE="./settings.gradle"
          else
            SETTINGS_FILE="$(
              find . \
                -type f \
                \( \
                  -name "settings.gradle.kts" \
                  -o \
                  -name "settings.gradle" \
                \) \
                -not -path "./.git/*" \
                | head -n 1
            )"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle.kts or settings.gradle was found."
            echo
            echo "This repository does not currently contain a detectable Gradle Android project."
            echo
            echo "Files found:"
            find . -maxdepth 3 -type f -not -path "./.git/*" | sort | head -n 300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          echo
          echo "Settings file:"
          echo "$SETTINGS_FILE"

          echo
          echo "Gradle project directory:"
          echo "$PROJECT_DIR"

          echo
          echo "Searching for Android app module..."

          APP_DIR=""

          if [ -d "$PROJECT_DIR/app" ]; then
            APP_DIR="$PROJECT_DIR/app"
          else
            APP_DIR="$(
              find "$PROJECT_DIR" \
                -type f \
                \( \
                  -path "*/app/build.gradle.kts" \
                  -o \
                  -path "*/app/build.gradle" \
                \) \
                -not -path "*/.gradle/*" \
                | head -n 1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$APP_DIR" ]; then
            echo "::error::No Android app module was detected."
            echo
            echo "Expected one of:"
            echo "  app/build.gradle.kts"
            echo "  app/build.gradle"
            exit 1
          fi

          APP_DIR="$(cd "$APP_DIR" && pwd)"

          echo
          echo "Android app directory:"
          echo "$APP_DIR"

          echo
          echo "Saving project paths..."

          echo "FLUX_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "FLUX_APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo
          echo "Project discovery: SUCCESS"


      # ==========================================================
      # 7. INSPECT PROJECT
      # ==========================================================

      - name: Inspect Gradle project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE PROJECT"
          echo "=============================================="

          cd "$FLUX_PROJECT_DIR"

          echo
          echo "Project directory:"
          pwd

          echo
          echo "Project files:"
          find . \
            -maxdepth 4 \
            -type f \
            -not -path "./.git/*" \
            -not -path "./.gradle/*" \
            | sort \
            | head -n 500

          echo
          echo "Settings:"
          if [ -f "settings.gradle.kts" ]; then
            echo "settings.gradle.kts"
          elif [ -f "settings.gradle" ]; then
            echo "settings.gradle"
          fi

          echo
          echo "App module:"
          ls -la "$FLUX_APP_DIR"


      # ==========================================================
      # 8. FIND GRADLE WRAPPER
      # ==========================================================

      - name: Locate Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE WRAPPER"
          echo "=============================================="

          cd "$FLUX_PROJECT_DIR"

          WRAPPER_DIR=""

          if [ -f "./gradlew" ]; then
            WRAPPER_DIR="$PWD"
          elif [ -f "../gradlew" ]; then
            WRAPPER_DIR="$(cd .. && pwd)"
          else
            WRAPPER_DIR="$(
              find .. \
                -maxdepth 3 \
                -type f \
                -name "gradlew" \
                -not -path "*/.git/*" \
                | head -n 1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$WRAPPER_DIR" ]; then
            echo "::error::gradlew was not found."
            exit 1
          fi

          WRAPPER_DIR="$(cd "$WRAPPER_DIR" && pwd)"

          echo
          echo "Wrapper directory:"
          echo "$WRAPPER_DIR"

          echo
          echo "Wrapper script:"
          ls -lh "$WRAPPER_DIR/gradlew"

          echo
          echo "Wrapper directory contents:"
          find "$WRAPPER_DIR/gradle/wrapper" \
            -maxdepth 1 \
            -type f \
            -print \
            2>/dev/null || true

          echo
          echo "Saving wrapper path..."

          echo "FLUX_WRAPPER_DIR=$WRAPPER_DIR" >> "$GITHUB_ENV"

          echo
          echo "Wrapper location: SUCCESS"


      # ==========================================================
      # 9. READ GRADLE VERSION
      # ==========================================================

      - name: Detect Gradle version
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE VERSION"
          echo "=============================================="

          cd "$FLUX_WRAPPER_DIR"

          PROPERTIES="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$PROPERTIES" ]; then
            echo "::error::gradle-wrapper.properties is missing."
            exit 1
          fi

          echo
          echo "gradle-wrapper.properties:"
          cat "$PROPERTIES"

          DISTRIBUTION_URL="$(
            grep '^distributionUrl=' "$PROPERTIES" \
            | sed 's/^distributionUrl=//' \
            | sed 's/\\//g'
          )"

          if [ -z "$DISTRIBUTION_URL" ]; then
            echo "::error::distributionUrl was not found."
            exit 1
          fi

          GRADLE_VERSION="$(
            echo "$DISTRIBUTION_URL" \
            | sed -nE 's/.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-.*/\1/p'
          )"

          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Could not determine Gradle version."
            echo "distributionUrl=$DISTRIBUTION_URL"
            exit 1
          fi

          echo
          echo "Detected Gradle version:"
          echo "$GRADLE_VERSION"

          echo "FLUX_GRADLE_VERSION=$GRADLE_VERSION" >> "$GITHUB_ENV"

          echo
          echo "Gradle version detection: SUCCESS"


      # ==========================================================
      # 10. SETUP GRADLE
      # ==========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.FLUX_GRADLE_VERSION }}
          cache-provider: basic
          validate-wrappers: false


      # ==========================================================
      # 11. REPAIR MISSING WRAPPER JAR
      # ==========================================================

      - name: Repair Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPAIRING GRADLE WRAPPER"
          echo "=============================================="

          cd "$FLUX_WRAPPER_DIR"

          chmod +x ./gradlew

          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then

            echo
            echo "gradle-wrapper.jar already exists."

          else

            echo
            echo "gradle-wrapper.jar is missing."
            echo "Generating wrapper using Gradle $FLUX_GRADLE_VERSION..."

            gradle wrapper \
              --gradle-version "$FLUX_GRADLE_VERSION" \
              --distribution-type bin

          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Gradle wrapper JAR could not be generated."
            exit 1
          fi

          echo
          echo "Wrapper files:"
          ls -lh gradle/wrapper/

          echo
          echo "Gradle wrapper repair: SUCCESS"


      # ==========================================================
      # 12. TEST GRADLE
      # ==========================================================

      - name: Test Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "TESTING GRADLE"
          echo "=============================================="

          cd "$FLUX_WRAPPER_DIR"

          ./gradlew \
            --version \
            --no-daemon

          echo
          echo "Gradle wrapper test: SUCCESS"


      # ==========================================================
      # 13. VERIFY ANDROID TASKS
      # ==========================================================

      - name: Verify Android Gradle tasks
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID GRADLE TASKS"
          echo "=============================================="

          cd "$FLUX_WRAPPER_DIR"

          ./gradlew \
            :app:tasks \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================================
      # 14. CLEAN
      # ==========================================================

      - name: Clean project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CLEANING PROJECT"
          echo "=============================================="

          cd "$FLUX_WRAPPER_DIR"

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================================
      # 15. BUILD DEBUG
      # ==========================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING DEBUG APK"
          echo "=============================================="

          cd "$FLUX_WRAPPER_DIR"

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================================
      # 16. BUILD RELEASE
      # ==========================================================

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING RELEASE APK"
          echo "=============================================="

          cd "$FLUX_WRAPPER_DIR"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================================
      # 17. LOCATE APKs
      # ==========================================================

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING APK OUTPUT"
          echo "=============================================="

          cd "$FLUX_WRAPPER_DIR"

          echo
          echo "APK files:"
          find . \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print

          DEBUG_APK="$(
            find "$FLUX_APP_DIR/build/outputs/apk/debug" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          RELEASE_APK="$(
            find "$FLUX_APP_DIR/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          echo
          echo "Debug APK:"
          echo "${DEBUG_APK:-NOT FOUND}"

          echo
          echo "Release APK:"
          echo "${RELEASE_APK:-NOT FOUND}"

          if [ -z "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release-apks"

          cp "$DEBUG_APK" \
            "$GITHUB_WORKSPACE/release-apks/FLUX-debug.apk"

          cp "$RELEASE_APK" \
            "$GITHUB_WORKSPACE/release-apks/FLUX-release.apk"

          echo
          echo "Final APKs:"
          ls -lh "$GITHUB_WORKSPACE/release-apks/"


      # ==========================================================
      # 18. UPLOAD APKs
      # ==========================================================

      - name: Upload FLUX APKs
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Android-APKs
          path: release-apks/
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 19. CREATE RELEASE
      # ==========================================================

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            release-apks/FLUX-debug.apk
            release-apks/FLUX-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
