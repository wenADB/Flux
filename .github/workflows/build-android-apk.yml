name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the APK attached'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Android SDK & Install Platform Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Secrets and Signing Keystores
        run: |
          # Copy .env.example if .env does not exist for the secrets plugin
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Create debug.keystore if missing
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=FLUX,C=US"
          fi

          # Create upload key for release build if missing
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android \
              -alias upload -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Release,O=FLUX,C=US"
          fi

      - name: Build APKs (Debug & Release)
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          gradle :app:assembleDebug --stacktrace
          gradle :app:assembleRelease --stacktrace || true

      - name: Prepare APK outputs
        run: |
          mkdir -p release-apks
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/FLUX-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/FLUX-debug.apk
          fi
          ls -lh release-apks/

      - name: Upload APKs to Artifacts (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-APK-Download
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: FLUX Android App (${{ github.event.inputs.release_tag || github.ref_name }})
          draft: false
          prerelease: false
          body: |
            ## FLUX: Android Performance & Optimization Engine
            Download the attached APK to install directly on your Android device:
            - **FLUX-release.apk**: Production release build.
            - **FLUX-debug.apk**: Debug build signed with standard debug credentials.
          files: release-apks/*.apk
