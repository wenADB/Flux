name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: false
        type: boolean

      release_tag:
        description: "Release tag"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "SDK directory:"
          ls -la "$ANDROID_HOME"

          echo
          echo "Installed SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo
          echo "Installed build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          echo
          echo "ADB:"
          adb version || true

          echo
          echo "SDKMANAGER:"
          sdkmanager --version || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROJECT VALIDATION"
          echo "========================================"

          test -f "./gradlew" || {
            echo "::error::gradlew was not found."
            exit 1
          }

          test -f "./settings.gradle.kts" || test -f "./settings.gradle" || {
            echo "::error::settings.gradle.kts or settings.gradle was not found."
            exit 1
          }

          test -d "./app" || {
            echo "::error::Android app module was not found."
            exit 1
          }

          chmod +x ./gradlew

          echo
          echo "Gradle version:"
          ./gradlew --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean project
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          DEBUG_APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          RELEASE_APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p release-apks

          cp "$DEBUG_APK" release-apks/FLUX-debug.apk
          cp "$RELEASE_APK" release-apks/FLUX-release.apk

          echo
          echo "Generated files:"
          ls -lh release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Android-APKs
          path: release-apks/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            release-apks/FLUX-debug.apk
            release-apks/FLUX-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
