name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: false
        type: boolean

      release_tag:
        description: "Release tag"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: flux-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FLUX Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # JAVA ENVIRONMENT
      # ============================================================

      - name: Verify Java environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FLUX BUILD ENVIRONMENT"
          echo "=============================================="

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "Java:"
          java -version

          echo
          echo "Java executable:"
          which java

          echo
          echo "Git:"
          git --version


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not-set}"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          echo
          echo "Resolved SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory was not found."
            exit 1
          fi

          echo
          echo "Installed platforms:"
          find "$SDK/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            2>/dev/null || true

          echo
          echo "Installed Build Tools:"
          find "$SDK/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            2>/dev/null || true

          echo
          echo "ADB:"
          if command -v adb >/dev/null 2>&1; then
            adb version
          else
            echo "adb not found"
          fi


      # ============================================================
      # ANDROID PATH
      # ============================================================

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -d "$SDK/platform-tools" ]; then
            echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          fi

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi


      # ============================================================
      # REPOSITORY STRUCTURE
      # ============================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPOSITORY STRUCTURE"
          echo "=============================================="

          echo
          echo "Current directory:"
          pwd

          echo
          echo "Root files:"
          ls -la

          echo
          echo "Gradle-related files:"
          find . \
            -maxdepth 3 \
            \( \
              -name "gradlew" \
              -o -name "gradlew.bat" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
              -o -name "gradle-wrapper.jar" \
            \) \
            -print


      # ============================================================
      # VALIDATE GRADLE WRAPPER
      # ============================================================

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE WRAPPER VALIDATION"
          echo "=============================================="

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew is missing."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties is missing."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::gradle-wrapper.jar is missing."
            exit 1
          fi

          chmod +x ./gradlew

          echo
          echo "gradlew:"
          ls -lh ./gradlew

          echo
          echo "gradle-wrapper.properties:"
          cat ./gradle/wrapper/gradle-wrapper.properties

          echo
          echo "gradle-wrapper.jar:"
          ls -lh ./gradle/wrapper/gradle-wrapper.jar

          echo
          echo "Wrapper validation: OK"


      # ============================================================
      # VALIDATE ANDROID PROJECT
      # ============================================================

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID PROJECT VALIDATION"
          echo "=============================================="

          if [ ! -f "./settings.gradle.kts" ] && [ ! -f "./settings.gradle" ]; then
            echo "::error::No settings.gradle.kts or settings.gradle found."
            exit 1
          fi

          if [ ! -d "./app" ]; then
            echo "::error::app/ directory was not found."
            exit 1
          fi

          echo
          echo "Settings file:"
          if [ -f "./settings.gradle.kts" ]; then
            echo "settings.gradle.kts"
          else
            echo "settings.gradle"
          fi

          echo
          echo "App module:"
          ls -la ./app

          echo
          echo "App Gradle files:"
          find ./app \
            -maxdepth 2 \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print

          echo
          echo "Android project validation: OK"


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # GRADLE DIAGNOSTIC
      # ============================================================

      - name: Test Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "TESTING GRADLE WRAPPER"
          echo "=============================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            help


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CLEAN BUILD"
          echo "=============================================="

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # DEBUG APK
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING DEBUG APK"
          echo "=============================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # RELEASE APK
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING RELEASE APK"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # APK VERIFICATION
      # ============================================================

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "APK OUTPUT"
          echo "=============================================="

          echo
          echo "All APK files:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          DEBUG_APK=$(find \
            app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          RELEASE_APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo
          echo "Debug APK:"
          echo "${DEBUG_APK:-NOT FOUND}"

          echo
          echo "Release APK:"
          echo "${RELEASE_APK:-NOT FOUND}"

          if [ -z "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p release-apks

          cp "$DEBUG_APK" \
            release-apks/FLUX-debug.apk

          cp "$RELEASE_APK" \
            release-apks/FLUX-release.apk

          echo
          echo "=============================================="
          echo "FINAL FLUX APKs"
          echo "=============================================="

          ls -lh release-apks/


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload FLUX APKs
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Android-APKs
          path: release-apks/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            release-apks/FLUX-debug.apk
            release-apks/FLUX-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
