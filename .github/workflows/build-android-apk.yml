name: Build & Release Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "9.3.1"

jobs:
  build:
    name: Build FLUX Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ============================================================
      # GENERATE WRAPPER IN ISOLATED DIRECTORY
      #
      # IMPORTANT:
      # Do NOT run "gradle wrapper" inside Flux.
      #
      # The Flux project itself is currently being repaired.
      # Generating the wrapper must not depend on Flux configuration.
      # ============================================================

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "GENERATING GRADLE WRAPPER"
          echo "=============================================="

          mkdir -p "$RUNNER_TEMP/gradle-wrapper"

          cd "$RUNNER_TEMP/gradle-wrapper"

          cat > settings.gradle.kts <<'EOF'
          rootProject.name = "wrapper-generator"
          EOF

          cat > build.gradle.kts <<'EOF'
          tasks.register("noop")
          EOF

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          echo
          echo "Generated wrapper:"
          find . -maxdepth 3 -type f -print

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          test -f gradlew.bat

          echo
          echo "✓ Wrapper generated."


      # ============================================================
      # COPY WRAPPER INTO FLUX
      # ============================================================

      - name: Install Gradle Wrapper into FLUX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p gradle/wrapper

          cp \
            "$RUNNER_TEMP/gradle-wrapper/gradle/wrapper/gradle-wrapper.jar" \
            gradle/wrapper/gradle-wrapper.jar

          cp \
            "$RUNNER_TEMP/gradle-wrapper/gradle/wrapper/gradle-wrapper.properties" \
            gradle/wrapper/gradle-wrapper.properties

          cp \
            "$RUNNER_TEMP/gradle-wrapper/gradlew" \
            gradlew

          cp \
            "$RUNNER_TEMP/gradle-wrapper/gradlew.bat" \
            gradlew.bat

          chmod +x gradlew

          echo
          echo "=============================================="
          echo "FLUX GRADLE WRAPPER"
          echo "=============================================="

          ls -lh gradle/wrapper/

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew

          echo
          echo "✓ FLUX now has gradle-wrapper.jar."


      # ============================================================
      # VERIFY WRAPPER
      # ============================================================

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version


      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

          echo "✓ Gradle project structure found."


      # ============================================================
      # LIST TASKS
      # ============================================================

      - name: Verify Android Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:tasks \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain


      # ============================================================
      # DEBUG APK
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain \
            --max-workers=2


      # ============================================================
      # RELEASE APK
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --console=plain \
            --max-workers=2


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "APK OUTPUT"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"


      # ============================================================
      # UPLOAD DEBUG
      # ============================================================

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: FLUX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ============================================================
      # UPLOAD RELEASE
      # ============================================================

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: FLUX-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
