name: Build & Release Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_VERSION: "9.3.1"

jobs:
  build:
    name: Build FLUX Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      #
      # IMPORTANT:
      # packages: '' prevents setup-android from attempting
      # to install the obsolete "tools" SDK package.
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      # ============================================================
      # INSTALL REQUIRED ANDROID SDK COMPONENTS
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo
          echo "Installed Android packages:"
          sdkmanager --list_installed


      # ============================================================
      # VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "FLUX PROJECT"
          echo "=============================================="

          echo "Working directory:"
          pwd

          echo
          echo "Root files:"
          ls -la

          echo
          echo "Required files:"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradle/libs.versions.toml

          echo "✓ settings.gradle.kts"
          echo "✓ build.gradle.kts"
          echo "✓ app/build.gradle.kts"
          echo "✓ gradle/libs.versions.toml"


      # ============================================================
      # GENERATE GRADLE WRAPPER
      #
      # This generates:
      #
      # gradle/wrapper/gradle-wrapper.jar
      #
      # automatically on GitHub's runner.
      # ============================================================

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "GRADLE WRAPPER"
          echo "=============================================="

          gradle --version

          echo
          echo "Generating Gradle $GRADLE_VERSION wrapper..."

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

          echo
          echo "Wrapper files:"
          ls -lh gradle/wrapper/

          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew

          echo
          echo "✓ Gradle wrapper generated successfully."


      # ============================================================
      # VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version


      # ============================================================
      # SHOW PROJECT TASKS
      # ============================================================

      - name: Verify Android Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:tasks \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace


      # ============================================================
      # DEBUG BUILD
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --max-workers=2


      # ============================================================
      # RELEASE BUILD
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --max-workers=2


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "APK OUTPUT"
          echo "=============================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          DEBUG_APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          RELEASE_APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"

          echo
          echo "Debug APK:"
          echo "$DEBUG_APK"

          echo
          echo "Release APK:"
          echo "$RELEASE_APK"


      # ============================================================
      # UPLOAD DEBUG APK
      # ============================================================

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: FLUX-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ============================================================
      # UPLOAD RELEASE APK
      # ============================================================

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: FLUX-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
