name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: false
        type: boolean

      release_tag:
        description: "Release tag"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: flux-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FLUX Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # JAVA VERIFICATION
      # ============================================================

      - name: Verify Java environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FLUX JAVA ENVIRONMENT"
          echo "=============================================="

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "Java version:"
          java -version

          echo
          echo "Java executable:"
          command -v java

          echo
          echo "Java path:"
          readlink -f "$(command -v java)" || true


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not-set}"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not-set}"

          echo
          echo "Resolved SDK:"
          echo "$SDK"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory was not found."
            exit 1
          fi

          echo
          echo "Android platforms:"
          find "$SDK/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            2>/dev/null || true

          echo
          echo "Android Build Tools:"
          find "$SDK/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            2>/dev/null || true

          echo
          echo "ADB:"
          if command -v adb >/dev/null 2>&1; then
            adb version
          else
            echo "adb not found"
          fi


      # ============================================================
      # ANDROID PATH
      # ============================================================

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -d "$SDK/platform-tools" ]; then
            echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          fi

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi


      # ============================================================
      # PROJECT INSPECTION
      # ============================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FLUX REPOSITORY"
          echo "=============================================="

          echo
          echo "Current directory:"
          pwd

          echo
          echo "Root:"
          ls -la

          echo
          echo "Gradle files:"
          find . \
            -maxdepth 4 \
            \( \
              -name "gradlew" \
              -o -name "gradlew.bat" \
              -o -name "gradle-wrapper.jar" \
              -o -name "gradle-wrapper.properties" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print


      # ============================================================
      # VALIDATE BASIC ANDROID PROJECT
      # ============================================================

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID PROJECT VALIDATION"
          echo "=============================================="

          if [ ! -d "./app" ]; then
            echo "::error::app/ directory was not found."
            exit 1
          fi

          if [ ! -f "./settings.gradle.kts" ] && \
             [ ! -f "./settings.gradle" ]; then
            echo "::error::settings.gradle.kts or settings.gradle was not found."
            exit 1
          fi

          if [ ! -f "./build.gradle.kts" ] && \
             [ ! -f "./build.gradle" ]; then
            echo "::error::Root build.gradle.kts or build.gradle was not found."
            exit 1
          fi

          echo
          echo "app/: OK"

          echo
          echo "Settings:"
          if [ -f "./settings.gradle.kts" ]; then
            echo "settings.gradle.kts"
          else
            echo "settings.gradle"
          fi

          echo
          echo "Root Gradle build:"
          if [ -f "./build.gradle.kts" ]; then
            echo "build.gradle.kts"
          else
            echo "build.gradle"
          fi

          echo
          echo "Android project structure: OK"


      # ============================================================
      # SETUP GRADLE
      # ============================================================

      # IMPORTANT:
      # A missing gradle-wrapper.jar means ./gradlew cannot start.
      #
      # We therefore install a known Gradle distribution first.
      # The wrapper is regenerated below if the JAR is missing.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
          validate-wrappers: false


      # ============================================================
      # REPAIR / GENERATE GRADLE WRAPPER
      # ============================================================

      - name: Repair Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE WRAPPER"
          echo "=============================================="

          mkdir -p gradle/wrapper

          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew is missing."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties is missing."
            exit 1
          fi

          echo
          echo "Wrapper properties:"
          cat ./gradle/wrapper/gradle-wrapper.properties

          echo

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then

            echo "gradle-wrapper.jar is missing."
            echo "Generating wrapper using installed Gradle..."

            gradle wrapper

          else

            echo "gradle-wrapper.jar already exists."

          fi

          chmod +x ./gradlew

          echo
          echo "Wrapper files:"
          ls -lh ./gradlew
          ls -lh ./gradle/wrapper/

          echo
          echo "Wrapper repair complete."


      # ============================================================
      # TEST GRADLE
      # ============================================================

      - name: Test Gradle wrapper
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "TESTING GRADLE WRAPPER"
          echo "=============================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            help


      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CLEANING FLUX"
          echo "=============================================="

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # BUILD DEBUG
      # ============================================================

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING DEBUG APK"
          echo "=============================================="

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # BUILD RELEASE
      # ============================================================

      - name: Build release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "BUILDING RELEASE APK"
          echo "=============================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================================
      # FIND APKs
      # ============================================================

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFYING APK OUTPUT"
          echo "=============================================="

          echo
          echo "Generated APK files:"
          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          DEBUG_APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          RELEASE_APK="$(
            find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          echo
          echo "Debug APK:"
          echo "${DEBUG_APK:-NOT FOUND}"

          echo
          echo "Release APK:"
          echo "${RELEASE_APK:-NOT FOUND}"

          if [ -z "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p release-apks

          cp "$DEBUG_APK" \
            release-apks/FLUX-debug.apk

          cp "$RELEASE_APK" \
            release-apks/FLUX-release.apk

          echo
          echo "Final APKs:"
          ls -lh release-apks/


      # ============================================================
      # UPLOAD APK ARTIFACT
      # ============================================================

      - name: Upload FLUX APKs
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Android-APKs
          path: release-apks/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            release-apks/FLUX-debug.apk
            release-apks/FLUX-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
