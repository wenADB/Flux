name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: false
        type: boolean

      release_tag:
        description: "Release tag (example: v1.0.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          pwd
          ls -la

          echo
          echo "=== Android project ==="

          test -f "./gradlew" || {
            echo "::error::gradlew was not found."
            exit 1
          }

          test -f "./settings.gradle.kts" || test -f "./settings.gradle" || {
            echo "::error::Gradle settings file was not found."
            exit 1
          }

          test -d "./app" || {
            echo "::error::app module was not found."
            exit 1
          }

          chmod +x ./gradlew

          echo
          echo "Gradle wrapper:"
          ./gradlew --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK output
        shell: bash
        run: |
          set -e

          echo "=== APK files ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          mkdir -p release-apks

          cp "$DEBUG_APK" release-apks/FLUX-debug.apk
          cp "$RELEASE_APK" release-apks/FLUX-release.apk

          echo
          echo "=== Release files ==="
          ls -lh release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FLUX-Android-APKs
          path: release-apks/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          files: |
            release-apks/FLUX-debug.apk
            release-apks/FLUX-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
