name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: false
        type: boolean

      release_tag:
        description: "Release tag"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: flux-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FLUX Android APK
    runs-on: ubuntu-latest

    env:
      # ============================================================
      # JAVA / GRADLE MEMORY
      # ============================================================

      JAVA_TOOL_OPTIONS: "-Xmx1g -XX:MaxMetaspaceSize=512m"

      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
        -Dorg.gradle.caching=true

      KOTLIN_DAEMON_JVM_OPTIONS: "-Xmx2g -XX:MaxMetaspaceSize=512m"

      _JAVA_OPTIONS: "-XX:+UseG1GC"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 3. VERIFY JAVA
      # ==========================================================

      - name: Verify Java environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FLUX JAVA ENVIRONMENT"
          echo "=============================================="

          echo
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo
          echo "Java version:"
          java -version

          echo
          echo "Java executable:"
          command -v java

          echo
          echo "Resolved Java:"
          readlink -f "$(command -v java)" || true

          echo
          echo "JAVA_TOOL_OPTIONS:"
          echo "$JAVA_TOOL_OPTIONS"

          echo
          echo "GRADLE_OPTS:"
          echo "$GRADLE_OPTS"


      # ==========================================================
      # 4. VERIFY ANDROID SDK
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK was not found."
            echo "Expected:"
            echo "$SDK"
            exit 1
          fi

          echo
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "SDK:"
          echo "$SDK"

          echo
          echo "Installed Android platforms:"
          find "$SDK
